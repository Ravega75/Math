<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Neon Rush</title>
  
  <!-- Carga de Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuración de Tailwind para usar Inter como fuente principal y personalizar colores -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
          }
        }
      }
    }
  </script>
  
  <!-- Fuente Inter de Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Iconos de Phosphor (Alternativa ligera a Lucide) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617; /* slate-950 */
      color: #f8fafc; /* slate-50 */
    }

    /* Scrollbar personalizada */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 10px; }

    /* Clases de utilidad para ocultar/mostrar secciones */
    .hidden { display: none !important; }
    
    /* Animaciones suaves para feedback */
    @keyframes pulse-bg-green {
      0%, 100% { background-color: rgba(34, 197, 94, 0); }
      50% { background-color: rgba(34, 197, 94, 0.2); }
    }
    @keyframes pulse-bg-red {
      0%, 100% { background-color: rgba(239, 68, 68, 0); }
      50% { background-color: rgba(239, 68, 68, 0.2); }
    }
    .animate-feedback-correct { animation: pulse-bg-green 0.6s ease-out; }
    .animate-feedback-wrong { animation: pulse-bg-red 0.6s ease-out; }
  </style>
</head>
<body class="selection:bg-fuchsia-500/30 overflow-x-hidden">

  <!-- VISTA: LOGIN -->
  <div id="view-login" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 relative overflow-hidden">
      <!-- Background decoration -->
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 via-purple-500 to-fuchsia-500"></div>
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-fuchsia-500/10 rounded-full blur-3xl"></div>
      
      <div class="text-center mb-8 relative z-10">
        <i class="ph ph-rocket text-cyan-400 text-6xl mb-4 animate-bounce inline-block"></i>
        <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">
          Math Neon Rush
        </h1>
        <p class="text-slate-400 mt-2 text-sm">Entrenamiento multiplicativo multijugador</p>
      </div>

      <form id="login-form" class="relative z-10">
        <div class="mb-6">
          <label for="player-name-input" class="block text-sm font-medium text-slate-300 mb-2">
            Tu Apodo Ciberespacial
          </label>
          <input
            type="text"
            id="player-name-input"
            maxlength="12"
            required
            placeholder="Ej. MathNinja"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all"
          />
        </div>
        <button
          type="submit"
          id="btn-join"
          disabled
          class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-cyan-500/30 transform transition-all active:scale-95 flex justify-center items-center gap-2 mb-4 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span id="btn-join-text">Conectando...</span>
        </button>
        
        <button
          type="button"
          id="btn-teacher-mode"
          class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold py-3 px-4 rounded-xl transition-all flex justify-center items-center gap-2"
        >
          <i class="ph ph-monitor-play text-xl"></i>
          Proyectar Pizarra del Profesor
        </button>
      </form>
    </div>
  </div>

  <!-- VISTA: JUEGO -->
  <div id="view-play" class="hidden min-h-screen p-4 md:p-8">
    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
      <div class="flex items-center gap-3">
        <i class="ph ph-rocket text-fuchsia-500 text-3xl"></i>
        <h1 class="text-2xl md:text-3xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-500 to-cyan-500">
          NEON RUSH
        </h1>
      </div>
      <div class="flex items-center gap-4 bg-slate-900 border border-slate-700 px-6 py-2 rounded-full shadow-lg">
        <span class="text-slate-400 font-medium">Jugador: <span id="display-player-name" class="text-white"></span></span>
        <div class="w-px h-6 bg-slate-700"></div>
        <span class="text-slate-400 font-medium flex items-center gap-2">
          Puntos: <span id="display-score" class="text-cyan-400 font-mono text-xl">0</span>
        </span>
      </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- PANEL IZQUIERDO: JUEGO -->
      <div class="lg:col-span-2">
        <div id="game-panel" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-10 shadow-2xl relative overflow-hidden h-full flex flex-col justify-center min-h-[400px]">
          
          <div id="feedback-overlay" class="absolute inset-0 z-0 pointer-events-none"></div>

          <div class="relative z-10 text-center mb-10">
            <p class="text-slate-400 text-sm tracking-widest uppercase mb-4 font-bold flex justify-center items-center gap-2">
              <i class="ph ph-lightning text-cyan-400"></i> Calcula rápido
            </p>
            <div id="question-display" class="text-7xl md:text-9xl font-black font-mono tracking-tighter drop-shadow-[0_0_15px_rgba(34,211,238,0.3)]">
              <!-- NÚMEROS SE INSERTAN AQUÍ -->
            </div>
          </div>

          <div id="options-container" class="grid grid-cols-2 gap-4 md:gap-6 relative z-10">
            <!-- BOTONES SE INSERTAN AQUÍ -->
          </div>
          
          <div class="mt-8 text-center text-slate-500 text-sm">
            +10 puntos correcta | -5 puntos incorrecta
          </div>
        </div>
      </div>

      <!-- PANEL DERECHO: LEADERBOARD LATERAL -->
      <div class="lg:col-span-1">
        <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 shadow-2xl h-full flex flex-col max-h-[600px]">
          <div class="flex items-center gap-3 mb-6">
            <i class="ph-fill ph-trophy text-yellow-400 text-2xl"></i>
            <h2 class="text-xl font-bold tracking-wide uppercase">Clasificación</h2>
          </div>
          <div id="sidebar-leaderboard" class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
            <!-- LISTA DE JUGADORES SE INSERTA AQUÍ -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- VISTA: PIZARRA (PROFESOR) -->
  <div id="view-whiteboard" class="hidden min-h-screen p-4 md:p-8 flex flex-col">
    <header class="text-center mb-8 relative">
      <button 
        id="btn-back-to-login"
        class="absolute left-0 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-lg border border-slate-700 transition-colors"
      >
        <i class="ph ph-arrow-left"></i> Volver
      </button>
      <h1 class="text-4xl md:text-6xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-cyan-400 animate-pulse drop-shadow-[0_0_15px_rgba(34,211,238,0.5)]">
        ARENA NEON RUSH
      </h1>
      <p class="text-lg md:text-xl text-slate-400 mt-2 tracking-widest uppercase font-bold">Clasificación en Vivo</p>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full flex flex-col items-center">
      <!-- Podium Top 3 -->
      <div id="podium-container" class="flex justify-center items-end gap-2 md:gap-8 mb-12 h-64 w-full mt-10">
        <!-- PODIO SE INSERTA AQUÍ -->
      </div>

      <!-- Rest of Leaderboard -->
      <div id="rest-leaderboard" class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-4 px-4">
        <!-- RESTO DE JUGADORES SE INSERTA AQUÍ -->
      </div>
      
      <div id="empty-leaderboard-msg" class="hidden text-center text-slate-500 mt-20 text-2xl flex flex-col items-center gap-4 bg-slate-900/50 p-10 rounded-3xl border border-slate-800">
        <i class="ph ph-monitor-play text-6xl opacity-50 mb-4"></i>
        <p>Esperando a que los estudiantes se unan a la arena...</p>
        <p class="text-sm text-slate-600">Los puntajes aparecerán aquí en vivo.</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- VARIABLES GLOBALES ---
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'math-game-app';
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Estado de la aplicación
    let state = {
      user: null,
      playerName: '',
      score: 0,
      leaderboard: [],
      num1: 0,
      num2: 0,
      correctAnswer: 0,
      isAnswering: false
    };

    // Referencias a elementos del DOM
    const views = {
      login: document.getElementById('view-login'),
      play: document.getElementById('view-play'),
      whiteboard: document.getElementById('view-whiteboard')
    };

    // --- FUNCIONES DE UTILIDAD (UI) ---
    function switchView(viewName) {
      Object.values(views).forEach(v => v.classList.add('hidden'));
      views[viewName].classList.remove('hidden');
    }

    // --- AUTENTICACIÓN ---
    async function initAuth() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.error("Error de autenticación:", error);
      }
    }

    onAuthStateChanged(auth, (currentUser) => {
      state.user = currentUser;
      const btnJoin = document.getElementById('btn-join');
      const btnJoinText = document.getElementById('btn-join-text');
      
      if (currentUser) {
        btnJoin.disabled = false;
        btnJoinText.innerHTML = 'Entrar a la Arena <i class="ph-bold ph-lightning"></i>';
      }
    });

    initAuth();

    // --- MULTIPLAYER LISTENER ---
    function setupLeaderboardListener() {
      if (!state.user) return;
      
      const playersRef = collection(db, 'artifacts', appId, 'public', 'data', 'neon_math_players');
      
      onSnapshot(playersRef, (snapshot) => {
        const playersData = snapshot.docs.map(doc => doc.data());
        
        // Filtrar inactivos (1 hora) y ordenar localmente
        const activePlayers = playersData.filter(p => Date.now() - p.lastActive < 1000 * 60 * 60);
        activePlayers.sort((a, b) => b.score - a.score);
        
        state.leaderboard = activePlayers;
        
        // Sincronizar score local
        const me = activePlayers.find(p => p.uid === state.user.uid);
        if (me && me.score !== state.score) {
          state.score = me.score;
          document.getElementById('display-score').innerText = state.score;
        }

        renderLeaderboards();
      }, (error) => {
        console.error("Error obteniendo leaderboard:", error);
      });
    }

    function renderLeaderboards() {
      // 1. Render Sidebar (Modo Juego)
      const sidebarContainer = document.getElementById('sidebar-leaderboard');
      sidebarContainer.innerHTML = '';
      
      if (state.leaderboard.length === 0) {
        sidebarContainer.innerHTML = `
          <div class="text-center text-slate-500 py-10 flex flex-col items-center">
            <i class="ph ph-warning-circle text-4xl mb-2 opacity-50"></i>
            <p>Esperando jugadores...</p>
          </div>`;
      } else {
        state.leaderboard.forEach((player, index) => {
          const isMe = state.user && player.uid === state.user.uid;
          let bgClass = "bg-slate-800/40 border border-slate-700/50";
          let iconHtml = `<span class="w-8 text-center text-slate-500 font-bold">${index + 1}</span>`;
          
          if (index === 0) { bgClass = "bg-gradient-to-r from-yellow-500/20 to-transparent border border-yellow-500/50"; iconHtml = `<i class="ph-fill ph-trophy text-yellow-400 text-2xl mr-2 animate-pulse"></i>`; }
          else if (index === 1) { bgClass = "bg-gradient-to-r from-slate-300/20 to-transparent border border-slate-300/50"; iconHtml = `<i class="ph-fill ph-medal text-gray-300 text-2xl mr-2"></i>`; }
          else if (index === 2) { bgClass = "bg-gradient-to-r from-amber-600/20 to-transparent border border-amber-600/50"; iconHtml = `<i class="ph-fill ph-medal text-amber-600 text-2xl mr-2"></i>`; }
          
          if (isMe) bgClass = bgClass.replace('border-slate-700/50', '').replace('border-yellow-500/50','').replace('border-slate-300/50','').replace('border-amber-600/50','') + " border-2 border-indigo-500";

          sidebarContainer.innerHTML += `
            <div class="flex items-center justify-between p-3 mb-2 rounded-lg transition-all ${bgClass}">
              <div class="flex items-center gap-3 overflow-hidden">
                ${iconHtml}
                <span class="font-semibold truncate max-w-[120px] ${isMe ? 'text-white' : 'text-slate-300'}">
                  ${player.name}
                  ${isMe ? '<span class="ml-2 text-xs bg-indigo-500/30 text-indigo-300 px-2 py-0.5 rounded-full">Tú</span>' : ''}
                </span>
              </div>
              <span class="font-mono font-bold text-lg text-cyan-400">${player.score}</span>
            </div>`;
        });
      }

      // 2. Render Whiteboard
      const top3 = state.leaderboard.slice(0, 3);
      const rest = state.leaderboard.slice(3, 13);
      const podiumContainer = document.getElementById('podium-container');
      const restContainer = document.getElementById('rest-leaderboard');
      const emptyMsg = document.getElementById('empty-leaderboard-msg');

      if (state.leaderboard.length === 0) {
        podiumContainer.innerHTML = '';
        restContainer.innerHTML = '';
        emptyMsg.classList.remove('hidden');
        return;
      }
      
      emptyMsg.classList.add('hidden');
      
      // Podio
      let podiumHtml = '';
      // 2do lugar
      if (top3[1]) {
        podiumHtml += `
          <div class="flex flex-col items-center z-10 w-1/3 max-w-[200px]">
            <div class="text-xl md:text-2xl font-bold mb-1 text-slate-300 truncate w-full text-center">${top3[1].name}</div>
            <div class="text-2xl md:text-3xl font-mono text-cyan-400 mb-2 font-bold">${top3[1].score} pt</div>
            <div class="w-full h-40 bg-gradient-to-t from-slate-400/30 to-slate-900 border-t-4 border-slate-300 rounded-t-xl flex justify-center pt-4 shadow-[0_0_30px_rgba(203,213,225,0.2)]">
              <i class="ph-fill ph-medal text-slate-300 text-5xl"></i>
            </div>
          </div>`;
      }
      // 1er lugar
      if (top3[0]) {
        podiumHtml += `
          <div class="flex flex-col items-center z-20 w-1/3 max-w-[240px]">
            <i class="ph-fill ph-crown text-yellow-400 text-5xl mb-2 animate-bounce"></i>
            <div class="text-2xl md:text-4xl font-black mb-1 text-yellow-400 truncate w-full text-center drop-shadow-[0_0_10px_rgba(250,204,21,0.5)]">${top3[0].name}</div>
            <div class="text-3xl md:text-5xl font-mono text-cyan-400 mb-2 font-black">${top3[0].score} pt</div>
            <div class="w-full h-52 md:h-60 bg-gradient-to-t from-yellow-500/40 to-slate-900 border-t-4 border-yellow-400 rounded-t-xl flex justify-center pt-4 shadow-[0_0_50px_rgba(250,204,21,0.4)]">
              <i class="ph-fill ph-trophy text-yellow-400 text-7xl drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]"></i>
            </div>
          </div>`;
      }
      // 3er lugar
      if (top3[2]) {
        podiumHtml += `
          <div class="flex flex-col items-center z-10 w-1/3 max-w-[200px]">
            <div class="text-xl md:text-2xl font-bold mb-1 text-amber-600 truncate w-full text-center">${top3[2].name}</div>
            <div class="text-2xl md:text-3xl font-mono text-cyan-400 mb-2 font-bold">${top3[2].score} pt</div>
            <div class="w-full h-32 md:h-36 bg-gradient-to-t from-amber-600/30 to-slate-900 border-t-4 border-amber-600 rounded-t-xl flex justify-center pt-4 shadow-[0_0_30px_rgba(217,119,6,0.2)]">
              <i class="ph-fill ph-medal text-amber-600 text-5xl"></i>
            </div>
          </div>`;
      }
      podiumContainer.innerHTML = podiumHtml;

      // Resto
      restContainer.innerHTML = rest.map((player, index) => `
        <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl flex justify-between items-center shadow-lg">
          <div class="flex items-center gap-4">
            <span class="text-2xl font-black text-slate-600 w-8">${index + 4}</span>
            <span class="text-xl md:text-2xl font-semibold text-slate-200 truncate max-w-[200px]">${player.name}</span>
          </div>
          <span class="text-xl md:text-2xl font-mono text-cyan-400 font-bold">${player.score} pt</span>
        </div>
      `).join('');
    }

    // --- LÓGICA DEL JUEGO ---
    function generateQuestion() {
      state.isAnswering = false;
      const n1 = Math.floor(Math.random() * 8) + 2;
      const n2 = Math.floor(Math.random() * 8) + 2;
      state.correctAnswer = n1 * n2;
      state.num1 = n1;
      state.num2 = n2;

      // Actualizar UI
      document.getElementById('question-display').innerHTML = `${n1} <span class="text-fuchsia-500 mx-2">×</span> ${n2}`;

      // Generar opciones
      let wrongOptions = new Set();
      while (wrongOptions.size < 3) {
        const offset = Math.floor(Math.random() * 5) + 1;
        const addOrSub = Math.random() > 0.5 ? 1 : -1;
        let wrongAns = state.correctAnswer + (offset * n1 * addOrSub);
        
        if (wrongAns <= 0 || wrongAns === state.correctAnswer) {
           wrongAns = state.correctAnswer + (Math.floor(Math.random() * 10) - 5);
        }
        if (wrongAns > 0 && wrongAns !== state.correctAnswer) {
          wrongOptions.add(wrongAns);
        }
      }

      const allOptions = [state.correctAnswer, ...Array.from(wrongOptions)];
      for (let i = allOptions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allOptions[i], allOptions[j]] = [allOptions[j], allOptions[i]];
      }

      // Renderizar botones
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = allOptions.map((opt, index) => `
        <button
          onclick="window.handleAnswer(${opt})"
          class="option-btn bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 hover:border-cyan-400 text-3xl md:text-4xl font-mono font-bold py-6 md:py-8 rounded-2xl transition-all shadow-lg active:scale-95 disabled:opacity-80 disabled:cursor-not-allowed"
        >
          ${opt}
        </button>
      `).join('');
      
      // Limpiar overlay
      document.getElementById('feedback-overlay').className = "absolute inset-0 z-0 pointer-events-none";
    }

    // Exponer handleAnswer globalmente para los botones inline
    window.handleAnswer = async function(selectedAnswer) {
      if (state.isAnswering) return;
      state.isAnswering = true;

      // Deshabilitar botones
      document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

      const isCorrect = selectedAnswer === state.correctAnswer;
      const pointChange = isCorrect ? 10 : -5;
      const newScore = Math.max(0, state.score + pointChange);
      
      state.score = newScore;
      document.getElementById('display-score').innerText = newScore;

      // Feedback visual
      const overlay = document.getElementById('feedback-overlay');
      overlay.classList.add(isCorrect ? 'animate-feedback-correct' : 'animate-feedback-wrong');

      // Actualizar Firebase
      if (state.user && state.playerName) {
        try {
          const playerDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'neon_math_players', state.user.uid);
          await setDoc(playerDocRef, {
            uid: state.user.uid,
            name: state.playerName,
            score: newScore,
            lastActive: Date.now()
          }, { merge: true });
        } catch (error) {
          console.error("Error guardando puntaje:", error);
        }
      }

      // Siguiente pregunta
      setTimeout(() => {
        generateQuestion();
      }, 600);
    };

    // --- EVENT LISTENERS NAVEGACIÓN ---
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nameInput = document.getElementById('player-name-input').value.trim();
      if (!nameInput || !state.user) return;
      
      state.playerName = nameInput;
      document.getElementById('display-player-name').innerText = state.playerName;
      
      try {
        const playerDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'neon_math_players', state.user.uid);
        await setDoc(playerDocRef, {
          uid: state.user.uid,
          name: state.playerName,
          score: state.score,
          lastActive: Date.now()
        });
        
        setupLeaderboardListener();
        generateQuestion();
        switchView('play');
      } catch (error) {
        console.error("Error al unirse:", error);
      }
    });

    document.getElementById('btn-teacher-mode').addEventListener('click', () => {
      setupLeaderboardListener();
      switchView('whiteboard');
    });

    document.getElementById('btn-back-to-login').addEventListener('click', () => {
      switchView('login');
    });

  </script>
</body>
</html>
